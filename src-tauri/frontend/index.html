<!DOCTYPE html>
<html lang="zh-CN" style="background:#f5f2ea">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>片刻 · 智能选片助手</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">

  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-text">片刻</div>
  </div>

  <div class="hero">
    <div class="sub">环境检测</div>
    <h1>正在准备<em>运行环境</em></h1>
  </div>

  <div class="card">
    <span class="spinner"></span>
    <span class="loading-text" id="status">正在检查环境...</span>
  </div>

</div>

<script>
(function() {
  'use strict';
  var invoke = window.__TAURI_INTERNALS__.invoke;
  var eventApi = window.__TAURI__ && window.__TAURI__.event;
  var $status = document.getElementById('status');

  // 监听后台事件，实时更新加载文字
  if (eventApi) {
    eventApi.listen('setup:status', function(e) {
      $status.textContent = e.payload;
    }).catch(function(){});
  }

  // 页面渲染后显示窗口
  invoke('show_window').catch(function(){});

  // 等到首帧渲染后启动 init_setup
  function startInit() {
    invoke('init_setup').then(function(r) {
      if (r.auto_start_modes && r.auto_start_modes.length > 0) {
        // 已安装，直接跳到安装/启动页
        var params = '?modes=' + encodeURIComponent(r.auto_start_modes.join(',')) +
                     '&runtime=' + encodeURIComponent(r.auto_start_runtime || 'auto');
        window.location.href = 'progress.html' + params;
        return;
      }

      // 未安装，跳转到环境信息页
      var params = '?p=' + encodeURIComponent(r.python_version || '') +
                   '&d=' + r.disk_free_gb.toFixed(1) +
                   '&m=' + r.memory_gb.toFixed(1) +
                   '&w=' + encodeURIComponent(r.warnings.join('|')) +
                   '&e=' + encodeURIComponent(r.errors.join('|')) +
                   '&s=' + encodeURIComponent(r.status_msgs.join('|'));
      window.location.href = 'env.html' + params;
    }).catch(function(e) {
      $status.textContent = '初始化失败: ' + JSON.stringify(e).substring(0, 100);
    });
  }

  requestAnimationFrame(function() {
    requestAnimationFrame(startInit);
  });
})();
</script>
</body>
</html>
