<!DOCTYPE html>
<html lang="zh-CN" style="background:#f5f2ea">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>片刻 · 智能选片助手</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">

  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-text">片刻</div>
  </div>

  <div class="hero">
    <div class="sub" id="hero-label">环境检测</div>
    <h1 id="hero-title">正在准备<em>运行环境</em></h1>
  </div>

  <!-- 加载卡片（环境检测阶段） -->
  <div class="card" id="loading-card">
    <span class="spinner" id="loading-spinner"></span>
    <span class="loading-text" id="status">正在检查环境...</span>
  </div>


</div>

<script>
(function() {
  'use strict';
  var invoke = window.__TAURI_INTERNALS__.invoke;
  function $(id) { return document.getElementById(id); }

  // 页面渲染后显示窗口
  invoke('show_window').catch(function(){});

  // 首帧渲染后启动
  function startInit() {
    invoke('init_setup').then(function(r) {
      if (r.auto_start_modes && r.auto_start_modes.length > 0) {
        // ─── 非首次启动：在当前页直接拉 Flask，不跳转 ───
        autoStart(r.auto_start_modes, r.auto_start_runtime || 'auto');
        return;
      }

      // ─── 首次启动：跳转到环境信息页 ───
      var params = '?p=' + encodeURIComponent(r.python_version || '') +
                   '&d=' + r.disk_free_gb.toFixed(1) +
                   '&m=' + r.memory_gb.toFixed(1) +
                   '&w=' + encodeURIComponent(r.warnings.join('|')) +
                   '&e=' + encodeURIComponent(r.errors.join('|')) +
                   '&s=' + encodeURIComponent(r.status_msgs.join('|'));
      window.location.href = 'env.html' + params;
    }).catch(function(e) {
      $('status').textContent = '初始化失败: ' + JSON.stringify(e).substring(0, 100);
    });
  }

  function autoStart(modes, runtime) {
    $('hero-label').textContent = '启动服务';
    $('hero-title').innerHTML = '正在启动<em>服务</em>';
    $('status').textContent = '服务启动中...';

    invoke('start_setup', { modes: modes, runtime: runtime }).catch(function(e) {
      $('status').textContent = '启动失败: ' + e;
    });

    // 轮询 Flask，就绪后跳转（Rust 侧 navigate 的兜底）
    var count = 0;
    var pollUrl = 'http://localhost:5057';
    var timer = setInterval(function() {
      if (++count > 120) { clearInterval(timer); return; }
      var xhr = new XMLHttpRequest();
      xhr.open('GET', pollUrl, true);
      xhr.timeout = 1000;
      xhr.onload = function() {
        if (xhr.status > 0) {
          clearInterval(timer);
          $('hero-title').innerHTML = '正在进入<em>片刻</em>';
          $('status').textContent = '服务已就绪';
          invoke('navigate_to_flask', { url: pollUrl }).catch(function(){});
        }
      };
      xhr.onerror = function(){};
      xhr.ontimeout = function(){};
      try { xhr.send(); } catch(e) {}
    }, 500);
  }

  requestAnimationFrame(function() {
    requestAnimationFrame(startInit);
  });
})();
</script>
</body>
</html>
