<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4866a"/>
      <stop offset="100%" stop-color="#a44d35"/>
    </linearGradient>
  </defs>

  <!-- rounded rect background -->
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="url(#bg)"/>

  <!-- subtle inner glow -->
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- outer ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="28"/>

  <!-- middle ring -->
  <circle cx="256" cy="256" r="95" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="24"/>

  <!-- inner dot -->
  <circle cx="256" cy="256" r="28" fill="rgba(255,255,255,0.85)"/>
</svg>
